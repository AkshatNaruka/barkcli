[package]
name = "barkcli-tui"
description = "Terminal UI for barkcli — the management layer for AI agents (ratatui)"
license = "MIT"
authors = ["Akshat Naruka <narukaakshat@gmail.com>"]
version = "0.4.0"
edition = "2021"
repository = "https://github.com/AkshatNaruka/barkcli"
homepage = "https://barkcli.vercel.app"
readme = "../README.md"
