[package]
name = "barkcli-core"
description = "Core library for barkcli — Git-native task tracking"
license = "MIT"
authors = ["Akshat Naruka <narukaakshat@gmail.com>"]
version = "0.2.0"
edition = "2021"
repository = "https://github.com/AkshatNaruka/barkcli"
homepage = "https://barkcli.vercel.app"
readme = "../README.md"
keywords = ["kanban", "git", "task", "project-management"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
comfy-table = "7"
owo-colors = "4.3.0"
regex = "1"
once_cell = "1"
ureq = { version = "2", features = ["json"] }
similar = "2"  # For diff-based analysis in code metrics
uuid = { version = "1", features = ["v4"] }  # For unique task IDs
md5 = "0.7"  # For file content hashing (conflict detection)
fs2 = "0.4"  # Advisory file locking for concurrent access
