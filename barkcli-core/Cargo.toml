[package]
name = "barkcli-core"
license = "MIT"
authors = ["Akshat Naruka <narukaakshat@gmail.com>"]
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
comfy-table = "7"
owo-colors = "4.3.0"
regex = "1"
once_cell = "1"
ureq = { version = "2", features = ["json"] }
