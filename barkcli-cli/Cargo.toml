[package]
name = "barkcli"
description = "Git-native Kanban board CLI — tasks as YAML in your repo"
license = "MIT"
authors = ["Akshat Naruka <narukaakshat@gmail.com>"]
version = "0.3.0"
edition = "2021"
repository = "https://github.com/AkshatNaruka/barkcli"
homepage = "https://barkcli.vercel.app"
readme = "../README.md"
keywords = ["kanban", "cli", "git", "task", "project-management"]
categories = ["command-line-utilities"]

[[bin]]
name = "barkcli"
path = "src/main.rs"

[[bin]]
name = "gen-docs"
path = "src/bin/gen-docs.rs"

[dependencies]
barkcli-core = { path = "../barkcli-core", version = "0.3.0" }
barkcli-tui = { path = "../barkcli-tui", version = "0.3.0", optional = true }
barkcli-server = { path = "../barkcli-server", version = "0.3.0", optional = true }
tokio = { version = "1", features = ["rt", "macros"] }
atty = "0.2"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap-markdown = "0.1"
libc = "0.2"

[dev-dependencies]
serde_json = "1"

[features]
default = ["tui", "serve"]
tui = ["barkcli-tui"]
serve = ["barkcli-server"]
