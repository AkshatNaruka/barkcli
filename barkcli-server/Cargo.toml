[package]
name = "barkcli-server"
description = "Web server for barkcli — browser Kanban with Axum"
license = "MIT"
authors = ["Akshat Naruka <narukaakshat@gmail.com>"]
version = "0.3.0"
edition = "2021"
repository = "https://github.com/AkshatNaruka/barkcli"
homepage = "https://barkcli.vercel.app"
readme = "../README.md"
keywords = ["kanban", "web", "axum"]
categories = ["command-line-utilities"]

[dependencies]
barkcli-core = { path = "../barkcli-core", version = "0.3.0" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures = "0.3"
notify = "7"
open = "5"
chrono = "0.4"
