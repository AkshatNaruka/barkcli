<!doctype html>
<html lang="en" data-theme="black">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>barkcli — Board</title>
    <meta
      name="description"
      content="barkcli — the management layer for AI agents. CLI, TUI, web and VS Code from one binary, no cloud."
    />
    <meta name="theme-color" content="#8B5E3C" />
    <!-- Installable web app (Notion/Linear-style): all paths relative so the
         same bundle works under any mount point (barkcli serve at /, GitHub
         Pages at /<repo>/app/). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="barkcli" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-icon.png" />
    <script>
      // Apply the saved appearance before paint. The app reads the full
      // appearance object later; this only prevents a dark flash on Paper.
      try {
        var preset = null;
        var raw = localStorage.getItem("barkcli-appearance-v1");
        if (raw) preset = JSON.parse(raw);
        var theme = preset && preset.theme;
        if (!theme) theme = localStorage.getItem("barkcli-theme");
        var light =
          theme === "light" ||
          (theme === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches);
        var mode = light ? "light" : "black";
        document.documentElement.setAttribute("data-theme", mode);
        document.documentElement.style.colorScheme = mode;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
