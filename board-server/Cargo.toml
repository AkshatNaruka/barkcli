[package]
name = "board-server"
version = "0.1.0"
edition = "2021"

[dependencies]
board-core = { path = "../board-core" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures = "0.3"
notify = "7"
open = "5"
