<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dog face icon for barkcli -->
  <circle cx="16" cy="16" r="14" fill="#8B5E3C"/>
  <!-- Left ear -->
  <ellipse cx="8" cy="8" rx="4" ry="6" fill="#6B4226" transform="rotate(-15 8 8)"/>
  <!-- Right ear -->
  <ellipse cx="24" cy="8" rx="4" ry="6" fill="#6B4226" transform="rotate(15 24 8)"/>
  <!-- Face -->
  <circle cx="16" cy="17" r="9" fill="#B8845C"/>
  <!-- Left eye -->
  <circle cx="12" cy="14" r="2" fill="#1A1816"/>
  <circle cx="12.5" cy="13.5" r="0.7" fill="#FFFFFF"/>
  <!-- Right eye -->
  <circle cx="20" cy="14" r="2" fill="#1A1816"/>
  <circle cx="20.5" cy="13.5" r="0.7" fill="#FFFFFF"/>
  <!-- Nose -->
  <ellipse cx="16" cy="19" rx="2.5" ry="2" fill="#1A1816"/>
  <ellipse cx="16" cy="18.5" rx="1" ry="0.5" fill="#333333"/>
  <!-- Mouth -->
  <path d="M14 21 Q16 23 18 21" stroke="#1A1816" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
