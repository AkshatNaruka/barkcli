<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dark Obsidian Canvas Gradient -->
    <linearGradient id="bark-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181A20"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>

    <!-- Squircle Subtle Bevel Rim -->
    <linearGradient id="bark-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Warm Caramel / Amber App Accent Gradient -->
    <linearGradient id="bark-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5AA7A"/>
      <stop offset="100%" stop-color="#B8845C"/>
    </linearGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="bark-glow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#B8845C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#B8845C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS Big Sur Squircle Body -->
  <rect x="1" y="1" width="98" height="98" rx="22" fill="url(#bark-bg)"/>
  <rect x="1" y="1" width="98" height="98" rx="22" fill="url(#bark-glow)"/>
  <rect x="1" y="1" width="98" height="98" rx="22" stroke="url(#bark-rim)" stroke-width="1.4"/>

  <!-- Minimalist Professional Dog Outline (App Accent Color #B8845C) -->
  <g stroke="url(#bark-accent)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head Crown -->
    <path d="M 30 25 C 42 18, 58 18, 70 25" />
    <!-- Left Ear -->
    <path d="M 30 25 C 16 27, 11 39, 12 51 C 13 60, 21 61, 27 53 C 30 48, 30 41, 30 35" />
    <!-- Right Ear -->
    <path d="M 70 25 C 84 27, 89 39, 88 51 C 87 60, 79 61, 73 53 C 70 48, 70 41, 70 35" />
    <!-- Cheeks to Chin -->
    <path d="M 30 43 C 26 56, 28 67, 35 74 C 41 79.5, 59 79.5, 65 74 C 72 67, 74 56, 70 43" />
    <!-- Nose (Curved Modern Shield) -->
    <path d="M 43.5 55 C 47 52.5, 53 52.5, 56.5 55 C 55 59.5, 52 63, 50 64 C 48 63, 45 59.5, 43.5 55 Z" fill="url(#bark-accent)" stroke="none" />
    <!-- Philtrum and Mouth -->
    <path d="M 50 64 L 50 70 M 44.5 70 C 47.5 72.5, 52.5 72.5, 55.5 70" stroke-width="5" />
  </g>
</svg>