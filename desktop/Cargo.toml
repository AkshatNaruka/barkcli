[package]
name = "barkcli-desktop"
version = "0.4.61"
edition = "2021"
description = "Bark — the desktop shell for barkcli"
authors = ["Akshat Naruka <narukaakshat@gmail.com> (@probiex007)"]
license = "MIT"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rfd = "0.15"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
