<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Board background (warm brown rounded square) -->
  <rect x="1" y="1" width="14" height="14" rx="3" fill="#8B5E3C"/>
  <!-- Three kanban columns -->
  <rect x="3" y="3" width="3" height="10" rx="0.5" fill="#F5EDE3"/>
  <rect x="7" y="3" width="3" height="10" rx="0.5" fill="#E8D5C3"/>
  <rect x="11" y="3" width="2" height="10" rx="0.5" fill="#F5EDE3"/>
  <!-- Card on the middle column (accent detail) -->
  <rect x="7.5" y="4" width="2" height="2.5" rx="0.4" fill="#6B4226"/>
  <!-- Card on the left column -->
  <rect x="3.5" y="8" width="2" height="2.5" rx="0.4" fill="#B8845C"/>
</svg>
